  <script>
    // Démarrage rapide : les nouvelles commencent à se télécharger tout de suite, pendant que le code de l'app se charge
    // (app.js les reprend ensuite : window.__pre).
    try {
      var rg = new URLSearchParams(location.search).get("r") || localStorage.getItem("prisme.region") || "qc";
      if (/^[a-z]{2,12}$/.test(rg) && location.protocol !== "file:") {
        window.__pre = {};
        ["edition-" + rg + ".json", "logos.json", "summaries.json", "translations.json"].forEach(function (n) {
          var p = fetch("data/" + n, { cache: "no-cache" });
          p.catch(function () {});
          window.__pre[n] = p;
        });
      }
    } catch (e) {}
    try {
      // Le sombre devient le thème de tout le monde, une seule fois (même si « Clair » avait été choisi avant).
      // Ensuite, ce que chacun choisit dans les réglages reste.
      if (localStorage.getItem("prisme.themeV") !== "2") { localStorage.setItem("prisme.theme", "dark"); localStorage.setItem("prisme.themeV", "2"); }
      const t = localStorage.getItem("prisme.theme");
      if (t === "auto") document.documentElement.removeAttribute("data-theme"); else if (t) document.documentElement.dataset.theme = t;
      // Lecture du soir : de 21 h à 6 h, des couleurs plus chaudes (sauf si on l'a désactivée).
      const h = new Date().getHours();
      if (localStorage.getItem("prisme.soir") !== "0" && (h >= 21 || h < 6)) document.documentElement.classList.add("soir");
    } catch (e) {}
    if (location.hostname === "localhost") {
      // Journal de diagnostic en local seulement : renvoie les erreurs du navigateur au terminal du serveur.
      var report = function (msg) { try { navigator.sendBeacon("/__log", String(msg)); } catch (e) {} };
      window.addEventListener("error", function (e) { report("ERREUR " + (e.message || (e.target && (e.target.src || e.target.href)) || "?") + (e.filename ? " @ " + e.filename + ":" + e.lineno : "")); }, true);
      window.addEventListener("unhandledrejection", function (e) { report("PROMESSE " + (e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
      window.addEventListener("load", function () { setTimeout(function () { report(window.__prismeReady ? "app démarrée" : "APP NON DÉMARRÉE (app.js n'a pas tourné)"); }, 1500); });
    }
    if (location.protocol === "file:") {
      document.addEventListener("DOMContentLoaded", function () {
        var d = document.createElement("div");
        d.setAttribute("role", "alert");
        d.style.cssText = "position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:24px;background:#F4F2EC;color:#141414;font:16px/1.5 Georgia,serif;text-align:center";
        d.innerHTML = '<div style="max-width:520px"><p style="font-size:24px;margin:0 0 12px">Prisme ne peut pas s’ouvrir comme un simple fichier.</p>' +
          '<p style="margin:0 0 20px;opacity:.75">Double-clique plutôt sur <b>Lancer Prisme.cmd</b> dans le dossier prisme, ou ouvre <a href="http://localhost:8888">http://localhost:8888</a> si le serveur tourne déjà.</p></div>';
        document.body.appendChild(d);
      });
    }
  </script>
