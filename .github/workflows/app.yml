# Publication rapide de l'app (1 à 2 minutes) : quand seuls les fichiers de l'app (public/) changent,
# on reprend le site déjà publié par le dernier passage du robot (avec toutes ses données),
# on y met la nouvelle version de l'app, et on publie. Le robot n'a pas besoin de relire les médias.
name: App (publication rapide)

on:
  push:
    branches: [main]
    paths: ["public/**"]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: app-rapide
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Le dernier passage du robot qui a vraiment publié le site. Un passage arrêté par sa garde finit « réussi » sans rien
      # publier, et un passage publié reste « en cours » pendant qu'il attend de se relancer : on regarde donc la publication.
      - name: Dernier passage publié du robot
        id: last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=""
          for r in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow edition.yml --limit 15 --json databaseId -q '.[].databaseId'); do
            ok=$(gh run view "$r" --repo "$GITHUB_REPOSITORY" --json jobs -q '[.jobs[] | select(.name == "deploy" and .conclusion == "success")] | length')
            if [ "$ok" = "1" ]; then id=$r; break; fi
          done
          if [ -z "$id" ]; then echo "Aucun passage publié trouvé."; exit 1; fi
          echo "Site repris du passage $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Site déjà publié (avec ses données)
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: ${{ steps.last.outputs.id }}
          github-token: ${{ github.token }}
          path: prev

      - name: Nouvelle version de l'app par-dessus
        run: |
          mkdir -p site
          tar -xf prev/artifact.tar -C site
          cp -r public/. site/
          ls site | head

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
